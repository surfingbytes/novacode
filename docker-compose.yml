# Entrypoint chowns /config to host UID/GID and runs the app as that user.
# Set in .env or export: UID=$(id -u) GID=$(id -g)
services:
  novacode:
    image: ${NOVACODE_IMAGE:-ghcr.io/surfingbytes/novacode:latest}
    ports:
      - "3030:3030"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: 
      - novacode
    environment:
      UID: ${UID}
      GID: ${GID}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ~/.novacode/config:/config
      - ~/.novacode/data:/data-root
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-3030}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - novacode-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - novacode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  novacode-postgres-data:
networks:
  novacode:
    driver: bridge
